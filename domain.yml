version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - mood_great
  - mood_unhappy
  - bot_challenge
  - book_appt
  - book_test_ride
  - slot_selected
  - vehicle_availability
  - brochure_request
  - vehicle_selected

actions:
  - action_fetch_slots
  - action_store_slot
  - action_store_name
  - action_book_appointment
  - action_show_vehicle_availability
  - action_show_vehicle_list_for_test_ride
  - action_store_vehicle_choice
  - action_store_vehicle_choice_for_test_ride
  - action_send_brochure

# entities:
#   - slot

slots:
  chosen_slot:
    type: text
    influence_conversation: true
    mappings:
      - type: custom      # We fill this manually in action_store_slot

  user_name:
    type: text
    influence_conversation: true
    mappings:
      - type: custom      # We fill this manually in action_store_name

  chosen_vehicle:
    type: text
    influence_conversation: true
    mappings:
      - type: custom      # We fill this manually in action_store_vehicle_choice


responses:
  utter_greet:
    - text: |
        BLR TVS MOTORS
        Welcome to BLR TVS MOTORS!
        How can we assist you today? Please select an option below:
      buttons:
        - title: "Vehicle Availability"
          payload: "/vehicle_availability"
        - title: "Book Test Ride"
          payload: "/book_test_ride"
        - title: "Brochure Request"
          payload: "/brochure_request"

  utter_cheer_up:
  - text: "Here is something to cheer you up:"
    image: "https://i.imgur.com/nGF1K8f.jpg"

  utter_did_that_help:
  - text: "Did that help you?"

  utter_happy:
  - text: "Great, carry on!"

  utter_goodbye:
  - text: "Bye"

  utter_iamabot:
  - text: "I am a bot, powered by Rasa."

  utter_slots:
  - text: "Please pick a slot below"

  utter_ask_name:
  - text: "May I know your name?"

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
