version: "3.1"

intents:
  - greet
  - goodbye
  - bot_challenge
  - view_vehicles
  - brochure_request
  - book_test_ride
  - vehicle_selected
  - user_name
  - talk_to_agent
  - provide_pincode
  - get_price_or_EMI
  - affirm
  - deny

entities:
  - name
  - pincode

slots:
  name:
    type: text
    mappings:
    - type: from_entity
      entity: name

  user_name:
    type: text
    mappings:
    - type: custom
  
  chosen_vehicle:
    type: text
    influence_conversation: true
    mappings:
      - type: custom

  phone:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  pincode:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: pincode

actions:
  - action_greet_user
  - action_ask_name
  - action_greet_with_menu
  - action_show_vehicle_list
  - action_store_vehicle_choice
  - action_show_vehicle_details
  - action_send_brochure
  - action_ask_name_for_test_ride
  - action_store_name
  - action_book_test_ride
  - action_talk_to_agent
  - action_ask_pincode
  - action_store_pincode_and_show_pricing
  - action_validate_slot_mappings
  - action_confirm_details

responses:
  utter_goodbye:
    - text: "Bye! Thanks for visiting TVS Motors! 🏍️"

  utter_iamabot:
    - text: "I am a bot, powered by Rasa."
  
  utter_invalid_name:
    - text: "I didn't catch that properly. Please type your full name again."
  
  utter_invalid_pincode:
    - text: "That doesn't look like a valid 6-digit pincode. Please try again. Example: 560001"
  
  utter_default:
    - text: "I didn't quite understand that. Would you like to talk to our sales executive?"

session_config:
  session_expiration_time: 30
  carry_over_slots_to_new_session: true