version: "3.1"

intents:
  - greet
  - goodbye
  - bot_challenge
  - view_vehicles
  - brochure_request
  - book_test_ride
  - vehicle_selected
  - user_name
  - talk_to_agent

actions:
  - action_greet_with_menu
  - action_show_vehicle_list
  - action_store_vehicle_choice_and_show_details
  - action_send_brochure
  - action_ask_name_for_test_ride
  - action_store_name
  - action_book_test_ride
  - action_talk_to_agent

slots:
  chosen_vehicle:
    type: text
    influence_conversation: true
    mappings:
      - type: custom

  user_name:
    type: text
    influence_conversation: true
    mappings:
      - type: custom

responses:
  utter_goodbye:
    - text: "Bye! Thanks for visiting TVS Motors! 🏍️"

  utter_iamabot:
    - text: "I am a bot, powered by Rasa."

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: false