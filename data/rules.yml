version: "3.1"

rules:

- rule: Say goodbye anytime the user says goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Say 'I am a bot' anytime the user challenges
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: Show vehicle availability when requested
  steps:
    - intent: vehicle_availability
    - action: action_show_vehicle_availability

- rule: Store vehicle choice when selected
  steps:
    - intent: vehicle_selected
    - action: action_store_vehicle_choice

- rule: Send brochure when requested
  steps:
    - intent: brochure_request
    - action: action_send_brochure

- rule: Fetch slots after booking intent
  steps:
    - intent: book_appt
    - action: action_fetch_slots

- rule: Ask user name after selecting a slot
  steps:
    - intent: slot_selected
    - action: action_store_slot
    - action: utter_ask_name

- rule: Capture user name after asking
  steps:
    - intent: user_name
    - action: action_store_name
    - action: action_book_appointment



