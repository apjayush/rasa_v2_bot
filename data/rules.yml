version: "3.1"

rules:

- rule: Greet user with menu
  steps:
  - intent: greet
  - action: action_greet_with_menu

- rule: Say goodbye anytime the user says goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Say 'I am a bot' anytime the user challenges
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: Show vehicle list when requested
  steps:
    - intent: view_vehicles
    - action: action_show_vehicle_list

- rule: Show vehicle details with buttons after selection
  steps:
    - intent: vehicle_selected
    - action: action_store_vehicle_choice_and_show_details

- rule: Send brochure when requested from vehicle details
  steps:
    - intent: brochure_request
    - action: action_send_brochure

- rule: Ask name when test ride requested from vehicle details
  steps:
    - intent: book_test_ride
    - action: action_ask_name_for_test_ride

- rule: Book test ride after getting name
  steps:
    - intent: user_name
    - action: action_store_name
    - action: action_book_test_ride

- rule: Connect to agent when requested
  steps:
    - intent: talk_to_agent
    - action: action_talk_to_agent